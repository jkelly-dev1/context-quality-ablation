name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to a full commit SHA, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing here calls a model. The paid sweeps ran once and their
      # results ship in results/; everything CI does is offline and needs no
      # credential. That is deliberate: a CI job that can spend money is a CI
      # job that will, on somebody else's pull request.
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      - run: python -m pytest -q

      # The harness gate. It proves the floor, the ceiling, the grader and
      # the field policy without a model, and exits non-zero if any of them
      # stops holding.
      - name: Pre-flight
        run: python scripts/preflight.py

      # Every number in README.md is re-derived from results/*.jsonl and must
      # appear verbatim. A re-run that shifts a figure fails here rather than
      # leaving the document quietly wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py

      # The report is the gate carrying three refusals (a question set, a
      # prompt and a per-arm assembly that no longer match the shipped rows),
      # and none of them is exercised by rendering nothing. Running it here
      # means an edit that invalidates the evidence fails on the push that
      # makes it, not the next time somebody renders a table by hand.
      - name: The shipped results still describe this code
        run: |
          python scripts/report.py
          python scripts/report.py results/sweep_openai.jsonl
          python scripts/report.py results/sweep_replicate.jsonl

      # A test that has never failed is a guess. This patches real code and
      # requires the named test to go red, and it refuses to start if a target
      # string has left a file or a named test has stopped collecting or no
      # longer passes on its own. It is what makes README.md's
      # "(mutation-checked: ...)" claims re-runnable instead of asserted.
      - name: Mutation suite
        run: python scripts/mutation_suite.py
